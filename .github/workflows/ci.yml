name: CI

# Least-privilege continuous integration for pushes and pull requests.
# Runs tests, lint, and a packaging/installed-wheel smoke check.  It never
# publishes, makes paid provider calls, requires provider secrets, or generates
# documentation from the repository source.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match the declared requires-python range and classifiers
        # (>=3.10,<3.13): exactly 3.10, 3.11, 3.12.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        # The repository is Ruff-clean in full. Keep production and every test,
        # including the schema/conversion suites, under the same gate.
        run: python -m ruff check .

  package:
    name: Build, twine check, installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/clean-env
          /tmp/clean-env/bin/python -m pip install --upgrade pip
          /tmp/clean-env/bin/python -m pip install dist/*.whl
      - name: Smoke-test the installed console script
        run: |
          /tmp/clean-env/bin/python -c "import codedoc; print(codedoc.__version__)"
          /tmp/clean-env/bin/codedoc --version
          /tmp/clean-env/bin/codedoc --help
