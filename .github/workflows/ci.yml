name: CI

# Least-privilege continuous integration for pushes and pull requests.
# Runs tests, lint, and a packaging/installed-wheel smoke check.  It never
# publishes, makes paid provider calls, requires provider secrets, or generates
# documentation from the repository source.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.suite.label }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        suite:
          - id: unit-meta
            label: Unit and meta
            paths: tests/unit tests/meta
          - id: integration
            label: Integration
            paths: tests/integration
          - id: contract-e2e
            label: Contracts and end-to-end
            paths: tests/contract tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run ${{ matrix.suite.label }} tests
        id: pytest
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite.id }}
        run: python -m pytest ${{ matrix.suite.paths }} --junitxml=junit-${{ matrix.suite.id }}-ubuntu-${{ matrix.python-version }}.xml ${{ matrix.python-version == '3.12' && '--cov=codedoc --cov-report=' || '' }}
      - name: Upload failing JUnit report
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite.id }}-ubuntu-${{ matrix.python-version }}
          path: junit-${{ matrix.suite.id }}-ubuntu-${{ matrix.python-version }}.xml
          if-no-files-found: error
      - name: Upload coverage data
        if: ${{ matrix.python-version == '3.12' && steps.pytest.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: covdata-${{ matrix.suite.id }}
          path: .coverage.${{ matrix.suite.id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  platform:
    name: Platform (${{ matrix.runner }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python-version: "3.10"
          - runner: ubuntu-latest
            python-version: "3.11"
          - runner: ubuntu-latest
            python-version: "3.12"
          - runner: windows-latest
            python-version: "3.12"
          - runner: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run platform tests
        id: pytest
        run: python -m pytest tests/platform --junitxml=junit-platform-${{ matrix.runner }}-${{ matrix.python-version }}.xml
      - name: Upload failing JUnit report
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-platform-${{ matrix.runner }}-${{ matrix.python-version }}
          path: junit-platform-${{ matrix.runner }}-${{ matrix.python-version }}.xml
          if-no-files-found: error

  coverage:
    name: Coverage (Python 3.12)
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: covdata-*
          path: .
          merge-multiple: true
      - name: Validate, combine, and render coverage
        run: |
          python -c "from pathlib import Path; expected={'.coverage.unit-meta','.coverage.integration','.coverage.contract-e2e'}; actual={p.name for p in Path('.').glob('.coverage.*')}; assert actual == expected, f'coverage data mismatch: expected={sorted(expected)!r}, actual={sorted(actual)!r}'"
          python -m coverage combine
          python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        # The repository is Ruff-clean in full. Keep production and every test,
        # including the schema/conversion suites, under the same gate.
        run: python -m ruff check .

  package:
    name: Build, twine check, installed-artifact smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Artifact-content contract
        run: CODEDOC_ARTIFACT_DIR="$PWD/dist" python -m pytest tests/contract/package/test_packaged_workflow.py -q
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/clean-env-wheel
          /tmp/clean-env-wheel/bin/python -m pip install --upgrade pip
          /tmp/clean-env-wheel/bin/python -m pip install dist/*.whl
      - name: Install sdist into a clean environment
        run: |
          python -m venv /tmp/clean-env-sdist
          /tmp/clean-env-sdist/bin/python -m pip install --upgrade pip
          /tmp/clean-env-sdist/bin/python -m pip install dist/*.tar.gz
      # Both smoke steps must run from OUTSIDE the checkout with the candidate
      # environment's own bin directory first on PATH (plan section 6.2, ledger
      # A16).  Two failure modes this deliberately avoids, both verified
      # locally against real built distributions:
      #   * `python -c` sets sys.path[0] to the cwd, so running the origin
      #     assertion from the checkout imports the SOURCE TREE, not the
      #     installed package, and the site-packages assertion fails.
      #   * the harness resolves the console script with shutil.which(), which
      #     without this PATH finds any other `codedoc` on the runner and
      #     aborts with console-script-environment-mismatch.
      # The expected version is read from pyproject.toml while still in the
      # checkout and passed through the environment, so no step needs both the
      # repository cwd and the installed import at the same time.
      - name: Smoke-test the wheel-installed distribution
        run: |
          CODEDOC_EXPECTED_VERSION="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          HARNESS="$PWD/tests/contract/package/installed_artifact_smoke.py"
          export PATH="/tmp/clean-env-wheel/bin:$PATH"
          export CODEDOC_EXPECTED_VERSION
          cd /tmp
          /tmp/clean-env-wheel/bin/python -c "import os, pathlib, site, codedoc; expected = os.environ['CODEDOC_EXPECTED_VERSION']; origin = pathlib.Path(codedoc.__file__).resolve(); roots = [pathlib.Path(v).resolve() for v in (*site.getsitepackages(), site.getusersitepackages()) if v]; assert any(origin.is_relative_to(r) for r in roots), f'not installed from site-packages: {origin}'; assert codedoc.__version__ == expected, (codedoc.__version__, expected)"
          /tmp/clean-env-wheel/bin/codedoc --version
          /tmp/clean-env-wheel/bin/codedoc --help
          /tmp/clean-env-wheel/bin/python "$HARNESS" --scenario all
      - name: Smoke-test the sdist-installed distribution
        run: |
          CODEDOC_EXPECTED_VERSION="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          HARNESS="$PWD/tests/contract/package/installed_artifact_smoke.py"
          export PATH="/tmp/clean-env-sdist/bin:$PATH"
          export CODEDOC_EXPECTED_VERSION
          cd /tmp
          /tmp/clean-env-sdist/bin/python -c "import os, pathlib, site, codedoc; expected = os.environ['CODEDOC_EXPECTED_VERSION']; origin = pathlib.Path(codedoc.__file__).resolve(); roots = [pathlib.Path(v).resolve() for v in (*site.getsitepackages(), site.getusersitepackages()) if v]; assert any(origin.is_relative_to(r) for r in roots), f'not installed from site-packages: {origin}'; assert codedoc.__version__ == expected, (codedoc.__version__, expected)"
          /tmp/clean-env-sdist/bin/codedoc --version
          /tmp/clean-env-sdist/bin/codedoc --help
          /tmp/clean-env-sdist/bin/python "$HARNESS" --scenario all
