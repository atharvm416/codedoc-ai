[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codedoc-ai"
version = "0.5.2"
description = "Local-first, LLM-agnostic codebase documentation for AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharv Mannur" }]
requires-python = ">=3.9"
keywords = ["documentation", "ai", "llm", "codebase", "agents", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
    "openai>=1.0",
    "anthropic>=0.20",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
codedoc = "codedoc.cli.cli:main"

[project.urls]
Homepage = "https://github.com/atharvm416/codedoc-ai"
Issues = "https://github.com/atharvm416/codedoc-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["codedoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
