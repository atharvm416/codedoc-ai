[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codedoc-ai"
version = "0.11.6"
description = "Generate structured, incremental documentation for any codebase using OpenAI, Anthropic, or Gemini"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharv Mannur" }]
requires-python = ">=3.10,<3.13"
keywords = [
    "ai",
    "anthropic",
    "cli",
    "code-analysis",
    "codebase",
    "developer-tools",
    "documentation",
    "gemini",
    "llm",
    "openai",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "openai~=2.36",
    "anthropic~=0.102",
    "google-genai~=2.3",
    "rich~=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
codedoc = "codedoc.cli.cli:main"

[project.urls]
Homepage = "https://github.com/atharvm416/codedoc-ai"
PyPI = "https://pypi.org/project/codedoc-ai/"
Documentation = "https://github.com/atharvm416/codedoc-ai#readme"
Source = "https://github.com/atharvm416/codedoc-ai"
Issues = "https://github.com/atharvm416/codedoc-ai/issues"
Changelog = "https://github.com/atharvm416/codedoc-ai/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["codedoc*"]

[tool.setuptools.package-data]
codedoc = ["templates/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
# tests/conftest.py redirects the temp ROOT into the repo (.pyt_tmp) so a
# locked/permission-denied system temp dir (e.g. Windows %TEMP%\pytest-of-<user>)
# does not make the suite unrunnable. We intentionally do NOT use --basetemp,
# which force-removes a fixed directory each run and fails on Windows when that
# directory is locked. Disable the cache plugin for deterministic runs.
addopts = "-p no:cacheprovider"
