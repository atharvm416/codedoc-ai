[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codedoc-ai"
version = "0.9.1"
description = "Generate structured, incremental documentation for any codebase using OpenAI, Anthropic, or Gemini"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharv Mannur" }]
requires-python = ">=3.9"
keywords = ["documentation", "ai", "llm", "codebase", "agents", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests~=2.33",
    "openai~=2.36",
    "anthropic~=0.102",
    "google-genai~=2.3",
    "python-dotenv~=1.2",
    "rich~=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
codedoc = "codedoc.cli.cli:main"

[project.urls]
Homepage = "https://github.com/atharvm416/codedoc-ai"
Issues = "https://github.com/atharvm416/codedoc-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["codedoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
# tests/conftest.py redirects the temp ROOT into the repo (.pyt_tmp) so a
# locked/permission-denied system temp dir (e.g. Windows %TEMP%\pytest-of-<user>)
# does not make the suite unrunnable. We intentionally do NOT use --basetemp,
# which force-removes a fixed directory each run and fails on Windows when that
# directory is locked. Disable the cache plugin for deterministic runs.
addopts = "-p no:cacheprovider"
